<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 | 연마</title>
    <meta name="description" content="요청한 연마 페이지를 찾을 수 없습니다.">
    <meta name="robots" content="noindex,follow">
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #101010;
            color: #f5f5f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.16), transparent 42%),
                #101010;
        }

        main {
            width: calc(100vw - 48px);
            max-width: 560px;
            min-width: 0;
            padding: clamp(32px, 8vw, 56px);
            border: 1px solid #333;
            border-radius: 24px;
            background: rgba(24, 24, 24, 0.94);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.34);
            text-align: center;
        }

        .status {
            margin: 0 0 12px;
            color: #60a5fa;
            font-size: clamp(3rem, 18vw, 6rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.06em;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 6vw, 2.25rem);
            line-height: 1.25;
            word-break: keep-all;
        }

        .message {
            margin: 18px auto 28px;
            color: #c7c7c7;
            line-height: 1.7;
            word-break: keep-all;
        }

        a {
            display: inline-flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            padding: 0 22px;
            border-radius: 999px;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            background: #1d4ed8;
        }

        a:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 4px;
        }
    </style>
    <script defer src="analytics.js?v=20260731-1"></script>
</head>
<body>
    <main>
        <p class="status" aria-hidden="true">404</p>
        <h1>페이지를 찾을 수 없습니다</h1>
        <p class="message">주소가 잘못 입력되었거나 페이지가 이동되었을 수 있습니다.</p>
        <a href="/">연마 홈으로 돌아가기</a>
    </main>
</body>
</html>
